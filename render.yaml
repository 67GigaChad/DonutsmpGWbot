# Render blueprint: https://render.com/docs/blueprint-spec
# Deploy with Dashboard -> New -> Blueprint, then set DISCORD_TOKEN when prompted.
services:
  - type: web
    name: donut-giveaway-bot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DISCORD_TOKEN
        sync: false # set the real token in the Render dashboard, never in git
      # - key: DEV_GUILD_ID
      #   sync: false
      # - key: KEEPALIVE_URL
      #   sync: false # only needed if RENDER_EXTERNAL_URL isn't picked up

    # Free instances can't have disks, so data/db.json is wiped on every
    # deploy/restart. Upgrade to a paid instance and uncomment to keep data:
    # disk:
    #   name: data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
